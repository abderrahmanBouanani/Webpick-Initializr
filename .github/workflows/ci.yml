name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  backend:
    name: Backend Build, Test & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webpick-initializr-code/webpick-initializr-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Compile backend application
        run: ./mvnw clean compile

      - name: Execute unit and integration tests with JaCoCo
        run: ./mvnw verify

      - name: Run Checkstyle code analysis
        run: ./mvnw checkstyle:check

      - name: Run SpotBugs static analysis
        run: ./mvnw spotbugs:check

      - name: Upload JaCoCo test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: webpick-initializr-code/webpick-initializr-backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webpick-initializr-code/webpick-initializr-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webpick-initializr-code/webpick-initializr-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build

      - name: Execute frontend unit tests
        run: npm test
