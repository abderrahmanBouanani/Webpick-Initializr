name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Artifacts and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webpick-initializr-code/webpick-initializr-frontend/package-lock.json

      - name: Build backend production JAR
        working-directory: webpick-initializr-code/webpick-initializr-backend
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -B

      - name: Build frontend production bundle
        working-directory: webpick-initializr-code/webpick-initializr-frontend
        run: |
          npm ci
          npm run build

      - name: Package frontend distribution archive
        run: |
          cd webpick-initializr-code/webpick-initializr-frontend/dist/webpick-initializr-frontend/browser
          zip -r ../../../../../webpick-initializr-frontend-dist.zip .

      - name: Copy backend executable JAR
        run: |
          cp webpick-initializr-code/webpick-initializr-backend/target/webpick-initializr-backend.jar ./webpick-initializr-backend.jar

      - name: Generate release notes and create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            webpick-initializr-backend.jar
            webpick-initializr-frontend-dist.zip
